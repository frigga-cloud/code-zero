name: Bug report
description: Something in code0 is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The three fields below resolve most reports on
        their own — please fill them in even if they seem irrelevant.

  - type: textarea
    id: status
    attributes:
      label: Output of `npx @frigga-cloud/code0 status`
      description: Paste it verbatim. It shows whether the credential actually works, which is the single most common cause.
      render: text
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Claude Code version and OS
      description: "`claude --version`, plus macOS / Linux / Windows"
      placeholder: "Claude Code 2.1.0, macOS 15.3"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: hook-output
    attributes:
      label: Hook diagnostics (optional)
      description: |
        If Claude seems to be missing codebase context, run this from inside a git repository and paste the result:

        ```
        echo '{"hook_event_name":"UserPromptSubmit","user_input":"test","cwd":"'$PWD'"}' \
          | npx @frigga-cloud/code0 hook user-prompt-submit
        ```
      render: text

  - type: markdown
    attributes:
      value: |
        **Please do not paste credentials.** `status` is safe — it prints no
        tokens — but `~/.claude/code0/credentials.json` contains a live refresh
        token and should never be attached.
