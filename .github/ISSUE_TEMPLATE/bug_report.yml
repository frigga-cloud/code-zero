name: Bug report
description: Something in CodeZero is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The three fields below resolve most reports on
        their own — please fill them in even if they seem irrelevant.

  - type: input
    id: build
    attributes:
      label: CodeZero build
      description: |
        The first line of the **code0** channel in the Output panel:
        `Ctrl`/`Cmd`+`Shift`+`P` → *Output*, then pick **code0** from the
        dropdown. It names the version, the build and the commit — which is
        what tells us exactly what you are running.
      placeholder: "CodeZero 1.0.1 (build 12, a1b2c3d)"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: VS Code version and OS
      description: "*Code → About Visual Studio Code*, plus macOS / Linux / Windows"
      placeholder: "VS Code 1.95.0, macOS 15.3"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: output-channel
    attributes:
      label: code0 output (optional)
      description: |
        The surrounding lines from that same **code0** Output channel. If the
        panel was blank, stuck, or a notification said something failed, this
        is usually where the reason is.
      render: text

  - type: markdown
    attributes:
      value: |
        **Please do not paste tokens.** CodeZero keeps your credentials in VS
        Code's secret storage and never prints them — but if something you are
        about to attach contains one, redact it first.
